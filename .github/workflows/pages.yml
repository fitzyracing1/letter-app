# Rebuilds the site from letters.log and deploys it to GitHub Pages.
# In the repo settings, set Pages > Build and deployment > Source to "GitHub Actions".
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['letters.log', 'lib/**', 'scripts/**', 'site.config.json', 'index.html', 'app.js', 'style.css', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate letters.log
        run: node scripts/build.js --check
      - name: Build site from letters.log (baseUrl from site.config.json)
        run: node scripts/build.js
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css lib letters letters.log sitemap.xml robots.txt .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
